[package]
name = "clvk_wasm"
version = "0.16.0"
authors = ["Richard Kiss <him@richardkiss.com>"]
edition = "2021"
license = "Apache-2.0"
description = "Implementation of `clvk` for Chik Network's cryptocurrency"
homepage = "https://github.com/Chik-Network/clvk_rs/"
repository = "https://github.com/Chik-Network/clvk_rs/"
readme = "README.md"

[lib]
name = "clvk_wasm"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
clvkr = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
js-sys = { workspace = true }
getrandom = { workspace = true, features = ["js"] }

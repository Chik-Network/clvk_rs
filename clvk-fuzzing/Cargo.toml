[package]
name = "clvk-fuzzing"
version = "0.19.0"
edition = "2024"
license = "Apache-2.0"
description = "Fuzzing tools for clvk Projects on Rust"
authors = ["Jack Nelson <j.nelson@chiknetwork.com>"]
homepage = "https://github.com/Chik-Network/clvk_rs"
repository = "https://github.com/Chik-Network/clvk_rs"


[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
clvkr = { workspace = true }
chik-sha2 = { workspace = true }
anyhow = { workspace = true }
chik-bls = { workspace = true, features = ["arbitrary"] }
clap = { workspace = true, features = ["derive"] }
hex = { workspace = true }
rand = { workspace = true }
